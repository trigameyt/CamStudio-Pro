name: Android debug build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu runner already provides an Android SDK. Using it
      # avoids unnecessarily downloading command-line tools a second time.
      - name: Verify Android SDK 35
        shell: bash
        run: |
          echo "Android SDK location: $ANDROID_HOME"
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0"
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Verify Android debug compilation
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Notice
        run: echo "This verifies compilation. A debug APK is not a public release-signed APK."
