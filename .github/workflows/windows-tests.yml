name: Windows tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python unit tests
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: windows
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app.py camstudio_v04 processor.py stream.py usb_transport.py usb_monitor.py secure_store.py single_instance.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
          OPENBLAS_NUM_THREADS: "1"
      - name: Check language settings
        run: python test_v100_i18n.py
        env:
          QT_QPA_PLATFORM: offscreen
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"