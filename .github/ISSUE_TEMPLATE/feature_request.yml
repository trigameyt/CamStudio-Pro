name: "Feature request"
description: Propose a CamStudio Pro improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        See ROADMAP.md first. CamStudio Pro is local-first and video-only.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: When I use CamStudio Pro, I need...
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your suggestion
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Relevant area
      options:
        - Windows
        - Android
        - USB / Wi-Fi
        - Scenes
        - Virtual camera
        - Recording
        - Translations / documentation
        - Other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or mockups (optional)
      description: Do not share private content.