name: "Bug report"
description: Report a reproducible CamStudio Pro problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Do not paste access keys, personal IP addresses, private videos, credentials or unredacted logs.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Windows application
        - Android companion
        - USB / ADB
        - Wi-Fi / connection
        - OBS / Discord virtual camera
        - Scenes / filters
        - Video recording / gallery
        - Documentation / translations
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: V1.0 RC1
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows version, Android version, phone model, connection type (no unique device IDs)
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Click...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Privacy check
      options:
        - label: I removed pairing keys and personal/private data.
          required: true